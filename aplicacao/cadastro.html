<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Doce Encanto Confeitaria</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <h1>Doce Encanto Confeitaria</h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="sobre.html">Sobre</a>
        <a href="produtos.html">Produtos</a>
        <a href="depoimentos.html">Depoimentos</a>
        <a href="contato.html">Contato</a>
        <a href="login.html">Login</a>
        <a href="area-cliente.html">Área do Cliente</a>
    </nav>
</header>

<section class="container">

    <h2>Criar/Editar Conta</h2>

    <form>

        <input
            type="text"
            placeholder="Nome Completo"
            required>

        <input
            type="email"
            placeholder="E-mail"
            required>

        <input
            type="tel"
            placeholder="Telefone"
            required>

        <input
            type="password"
            placeholder="Senha"
            required>

        <input
            type="password"
            placeholder="Confirmar Senha"
            required>

        <a href="#cadastro-sucesso" class="botao-galeria">
            Criar Conta
        </a>

    </form>

    <div id="cadastro-sucesso" class="popup">

    <div class="popup-conteudo">

        <h2>Cadastro Realizado!</h2>

        <p>
            Sua conta foi criada/atualizada com sucesso.
        </p>

        <a href="login.html" class="fechar-popup">
            Ir para Login
        </a>

    </div>

    </div>
</section>

<footer>
    <p>© 2026 Doce Encanto Confeitaria</p>
</footer>

</body>
</html>
