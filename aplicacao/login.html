<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Doce Encanto Confeitaria</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <h1>Doce Encanto Confeitaria</h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="sobre.html">Sobre</a>
        <a href="produtos.html">Produtos</a>
        <a href="depoimentos.html">Depoimentos</a>
        <a href="contato.html">Contato</a>
        <a href="login.html">Login</a>
        <a href="area-cliente.html">Área do Cliente</a>
    </nav>
</header>

<section class="container">

    <h2>Entrar</h2>

    <form>

        <input
            type="email"
            placeholder="E-mail"
            required>

        <input
            type="password"
            placeholder="Senha"
            required>

        <a href="#login-sucesso" class="botao-galeria">
            Entrar
        </a>

    </form>

    <br>

    <p style="text-align:center;">
        Ainda não possui conta?
        <a href="cadastro.html">Cadastre-se</a>
    </p>

    <div id="login-sucesso" class="popup">

    <div class="popup-conteudo">

        <h2>Login Realizado!</h2>

        <p>
            Você entrou no sistema com sucesso.
        </p>

        <a href="area-cliente.html" class="fechar-popup">
            Ir para Área do Cliente
        </a>

    </div>

</div>

</section>

<footer>
    <p>© 2026 Doce Encanto Confeitaria</p>
</footer>

</body>
</html>
